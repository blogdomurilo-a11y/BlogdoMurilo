# ============================================================
#  Configuração do blog (Jekyll + GitHub Pages)
# ============================================================

title: Cartas & Mapas
tagline: Geografia, ensaios e crônicas
description: >-
  Um blog de geografia, ensaios e crônicas: lugares, paisagens,
  ideias e pequenas histórias do cotidiano.
lang: pt-BR
timezone: America/Sao_Paulo

author:
  name: Seu Nome
  bio: Escrevo sobre geografia, lugares e o que acontece entre um mapa e outro.
  email: voce@exemplo.com

# Repositório chamado blogdomurilo-a11y.github.io  →  baseurl vazio
url: "https://blogdomurilo-a11y.github.io"
baseurl: ""

github_username: ""
instagram_username: ""

# Newsletter (opcional): deixe vazio para mostrar só o botão de RSS.
newsletter_action: ""

permalink: /:categories/:year/:month/:slug/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

# Paginação da página inicial (8 textos por página)
paginate: 8
paginate_path: "/pagina:num/"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

feed:
  path: feed.xml

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
